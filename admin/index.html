<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Signing wall · Admin</title>
  </head>
  <body>
    <main class="wall-admin">
      <a href="/">← Portfolio</a>
      <h1>Wall admin.</h1>
      <form class="admin-login">
        <label>Username<input name="username" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="wall-primary">Sign in</button>
      </form>
      <nav class="admin-nav" aria-label="Admin pages" hidden>
        <a href="/admin/" data-admin-view="wall">Signatures</a>
        <a href="/admin/stats" data-admin-view="stats">Stats</a>
      </nav>
      <div class="admin-actions" hidden>
        <button type="button" data-admin="refresh">Refresh</button>
        <button type="button" data-admin="logout">Sign out</button>
      </div>
      <p class="admin-status" role="status"></p>
      <div class="admin-signatures"></div>
      <section class="admin-stats" aria-label="Visitor statistics" hidden>
        <label class="stats-range">Date range
          <select name="range"><option value="1">Today</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option></select>
        </label>
        <div class="stats-content"></div>
      </section>
    </main>
    <script type="module" src="/src/wall-admin.js"></script>
  </body>
</html>
