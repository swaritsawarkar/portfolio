<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Signing wall · Admin</title>
  </head>
  <body>
    <main class="wall-admin">
      <a href="/">← Portfolio</a>
      <h1>Wall admin.</h1>
      <form class="admin-login">
        <label>Username<input name="username" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="wall-primary">Sign in</button>
      </form>
      <div class="admin-actions" hidden>
        <button type="button" data-admin="refresh">Refresh</button>
        <button type="button" data-admin="logout">Sign out</button>
      </div>
      <p class="admin-status" role="status"></p>
      <div class="admin-signatures"></div>
    </main>
    <script type="module" src="/src/wall-admin.js"></script>
  </body>
</html>
